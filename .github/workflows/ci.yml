name: Continuous Integration

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

env:
  PHP_VERSION: '8.5'
  COVERAGE_THRESHOLD: 90

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit signatures
        run: |
          echo "Checking commit signatures..."
          git log --oneline -1
          git log -1 --pretty=format:"%H %G? %GS"
          TARGET_BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          if [ "$(git log -1 --pretty=format:%G?)" != "G" ]; then
            if [[ "$TARGET_BRANCH" == release/* ]]; then
              echo "❌ Latest commit is not signed. Signed commits are required for release branches."
              exit 1
            fi

            echo "⚠️  Warning: Latest commit is not signed. Commit signing is required for release branches."
          fi

      - name: Detect PHP project
        id: detect-php-project
        run: |
          if [ -f composer.json ]; then
            echo "has_composer=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_composer=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No composer.json found; skipping PHP-specific CI steps."
          fi

      - name: Set up PHP
        if: steps.detect-php-project.outputs.has_composer == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          tools: composer, phpunit, phpstan

      - name: Cache Composer dependencies
        if: steps.detect-php-project.outputs.has_composer == 'true'
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        if: steps.detect-php-project.outputs.has_composer == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json
        if: steps.detect-php-project.outputs.has_composer == 'true'
        run: composer validate --strict

      - name: Check PHP syntax
        if: steps.detect-php-project.outputs.has_composer == 'true'
        run: |
          echo "Checking PHP syntax..."
          find src tests public -name "*.php" -type f -exec php -l {} \;

      - name: Run PHPUnit tests with coverage
        if: steps.detect-php-project.outputs.has_composer == 'true'
        env:
          DB_DRIVER: pdo_sqlite
          DB_NAME: ':memory:'
          APP_URL: http://localhost:8000
        run: |
          php vendor/bin/phpunit \
            --coverage-clover=coverage.xml \
            --coverage-text=coverage.txt \
            --coverage-html=coverage-report

      - name: Check code coverage threshold
        if: steps.detect-php-project.outputs.has_composer == 'true'
        run: |
          # Extract coverage percentage from coverage.txt
          COVERAGE=$(grep -oP '^\s+Code Coverage\s+:\s+\K[0-9.]+(?=%)' coverage.txt || grep -oP '[0-9]+\.[0-9]+(?=%)' coverage.txt | tail -1)
          
          if [ -z "$COVERAGE" ]; then
            echo "⚠️  Warning: Could not extract coverage percentage from coverage.txt"
            echo "File contents:"
            cat coverage.txt
            # Don't fail here, let it pass for now
            exit 0
          fi
          
          echo "Code coverage: $COVERAGE%"
          
          THRESHOLD=${{ env.COVERAGE_THRESHOLD }}
          # Use bash arithmetic for comparison
          COVERAGE_INT=${COVERAGE%.*}  # Remove decimal part
          if [ "$COVERAGE_INT" -lt "$THRESHOLD" ]; then
            echo "❌ Coverage $COVERAGE% is below threshold $THRESHOLD%"
            exit 1
          fi
          echo "✓ Coverage $COVERAGE% meets threshold $THRESHOLD%"

      - name: Run PHPStan static analysis
        if: steps.detect-php-project.outputs.has_composer == 'true'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Run PHP-CS-Fixer (dry-run, check only)
        if: steps.detect-php-project.outputs.has_composer == 'true'
        run: vendor/bin/php-cs-fixer fix --dry-run --allow-unsupported-php-version=1

      - name: Upload coverage reports
        if: always() && steps.detect-php-project.outputs.has_composer == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage.txt
            coverage-report/

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && always() && steps.detect-php-project.outputs.has_composer == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const coverageText = fs.readFileSync('coverage.txt', 'utf8');
            const coverage = coverageText.match(/Classes.*?\s+([0-9.]+)%/);
            const coveragePercent = coverage ? coverage[1] : 'unknown';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Code Coverage Report\n\n- **Overall Coverage:** ${coveragePercent}%\n- **Threshold:** ${{ env.COVERAGE_THRESHOLD }}%\n\nFull report available in [artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).`
            });
