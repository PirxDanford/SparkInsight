name: Quality Gates

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

env:
  PHP_VERSION: '8.5'
  COVERAGE_THRESHOLD: 80

permissions:
  contents: read
  issues: write

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking commit signatures..."
          git log --oneline -1
          COMMIT_SHA=$(git rev-parse HEAD)
          VERIFICATION=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq '.commit.verification.verified')
          REASON=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq '.commit.verification.reason')
          TARGET_BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          echo "Commit: $COMMIT_SHA"
          echo "GitHub verification: $VERIFICATION ($REASON)"

          if [ "$VERIFICATION" != "true" ]; then
            if [[ "$TARGET_BRANCH" == release/* ]]; then
              echo "❌ Latest commit is not signed. Signed commits are required for release branches."
              exit 1
            fi

            echo "⚠️  Warning: Latest commit is not signed. Commit signing is required for release branches."
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          tools: composer, phpunit, phpstan

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate migration files
        run: php tools/ci/check_migrations.php

      - name: Run migration runner unit tests
        run: php vendor/bin/phpunit tests/Unit/Service/MigrationRunnerTest.php

      - name: Check migration status command
        env:
          DB_DRIVER: pdo_sqlite
          DB_NAME: ':memory:'
          APP_URL: http://localhost:8000
        run: php si.php db:migrate --status

      - name: Ensure conflicting migration options fail fast
        env:
          DB_DRIVER: pdo_sqlite
          DB_NAME: ':memory:'
          APP_URL: http://localhost:8000
        run: |
          set +e
          php si.php db:migrate --status --rollback
          exit_code=$?
          set -e

          if [ "$exit_code" -eq 0 ]; then
            echo "Expected db:migrate --status --rollback to fail, but it succeeded."
            exit 1
          fi

      - name: Validate composer.json
        run: composer validate --strict

      - name: Verify Composer install simulation
        run: composer test:install-sim

      - name: Check PHP syntax
        run: |
          echo "Checking PHP syntax..."
          find src tests public -name "*.php" -type f -exec php -l {} \;

      - name: Run PHPUnit tests with coverage
        env:
          DB_DRIVER: pdo_sqlite
          DB_NAME: ':memory:'
          APP_URL: http://localhost:8000
        run: |
          php vendor/bin/phpunit \
            --coverage-clover=coverage.xml \
            --coverage-xml=tmp/coverage-xml \
            --coverage-text=coverage.txt \
            --coverage-html=coverage-report

      - name: Enforce method coverage guardrail
        run: php tools/ci/check_method_coverage.php tmp/coverage-xml

      - name: Check code coverage threshold
        run: |
          # Extract line coverage percentage from coverage.txt summary
          COVERAGE=$(grep -oP '^\s*Lines:\s+\K[0-9]+(?:\.[0-9]+)?(?=%)' coverage.txt | head -1)
          
          if [ -z "$COVERAGE" ]; then
            echo "⚠️  Warning: Could not extract coverage percentage from coverage.txt"
            echo "File contents:"
            cat coverage.txt
            # Don't fail here, let it pass for now
            exit 0
          fi
          
          echo "Code coverage: $COVERAGE%"
          
          THRESHOLD=${{ env.COVERAGE_THRESHOLD }}
          # Use bash arithmetic for comparison
          COVERAGE_INT=${COVERAGE%.*}  # Remove decimal part
          if [ "$COVERAGE_INT" -lt "$THRESHOLD" ]; then
            echo "❌ Coverage $COVERAGE% is below threshold $THRESHOLD%"
            exit 1
          fi
          echo "✓ Coverage $COVERAGE% meets threshold $THRESHOLD%"

      - name: Run PHPStan static analysis
        if: always()
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Run PHP-CS-Fixer (dry-run, check only)
        if: always()
        run: vendor/bin/php-cs-fixer fix --dry-run --allow-unsupported-php-version=1

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage.txt
            coverage-report/

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('coverage.txt')) {
              console.log('No coverage.txt found — skipping coverage comment.');
              return;
            }
            const coverageText = fs.readFileSync('coverage.txt', 'utf8');
            const coverage = coverageText.match(/Lines:\s+([0-9.]+)%/);
            const coveragePercent = coverage ? coverage[1] : 'unknown';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Code Coverage Report\n\n- **Overall Coverage:** ${coveragePercent}%\n- **Threshold:** ${{ env.COVERAGE_THRESHOLD }}%\n\nFull report available in [artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).`
            });
