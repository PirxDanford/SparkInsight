name: Migration Checks

on:
  pull_request:
    branches:
      - main
      - 'release/*'
    paths:
      - 'database/migrations/**'
      - 'src/Service/MigrationRunner.php'
      - 'src/Command/MigrateDbCommand.php'
      - 'tools/ci/check_migrations.php'
      - 'docs/migrations.md'
      - '.github/workflows/migration-checks.yml'
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - 'database/migrations/**'
      - 'src/Service/MigrationRunner.php'
      - 'src/Command/MigrateDbCommand.php'
      - 'tools/ci/check_migrations.php'
      - 'docs/migrations.md'
      - '.github/workflows/migration-checks.yml'
  workflow_dispatch:

jobs:
  migration-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit signatures
        run: |
          echo "Checking commit signatures..."
          COMMIT_SHA=$(git rev-parse HEAD)
          SIGNATURE_STATUS=$(git log -1 --pretty=format:%G?)
          TARGET_BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          echo "Commit: $COMMIT_SHA"
          echo "Signature status: $SIGNATURE_STATUS"
          
          if [ "$SIGNATURE_STATUS" != "G" ]; then
            if [[ "$TARGET_BRANCH" == release/* ]]; then
              echo "❌ Latest commit is not signed with a valid GPG key."
              echo "Commit signing is required for release/* branches."
              exit 1
            fi

            echo "⚠️  Warning: Latest commit is not signed with a valid GPG key."
            echo "Commit signing is required for release/* branches."
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate migration files
        run: php tools/ci/check_migrations.php

      - name: Run migration runner unit tests
        run: php vendor/bin/phpunit tests/Unit/Service/MigrationRunnerTest.php

      - name: Check migration status command
        env:
          DB_DRIVER: pdo_sqlite
          DB_NAME: ':memory:'
          APP_URL: http://localhost:8000
        run: php si.php db:migrate --status

      - name: Ensure conflicting options fail fast
        env:
          DB_DRIVER: pdo_sqlite
          DB_NAME: ':memory:'
          APP_URL: http://localhost:8000
        run: |
          set +e
          php si.php db:migrate --status --rollback
          exit_code=$?
          set -e

          if [ "$exit_code" -eq 0 ]; then
            echo "Expected db:migrate --status --rollback to fail, but it succeeded."
            exit 1
          fi
